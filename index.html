<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>抽選管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header class="header">
  <button id="backButton" class="header-btn hidden">‹</button>
  <h1 id="pageTitle">ホーム</h1>
  <button id="addButton" class="header-btn">＋</button>
</header>
<main id="screen"></main>
<nav class="bottom-nav">
  <button data-page="home">⌂<span>ホーム</span></button>
  <button data-page="calendar">▦<span>カレンダー</span></button>
  <button data-page="events">●<span>イベント</span></button>
  <button data-page="products">□<span>商品</span></button>
  <button data-page="schedules">◷<span>予定</span></button>
</nav>
</div>

<div id="addModal" class="overlay hidden">
  <div class="sheet">
    <button class="close" onclick="closeAdd()">×</button>
    <h2>新規登録</h2>
    <button onclick="newEvent()">イベント</button>
    <button onclick="newProduct()">POP UP・販売</button>
    <button onclick="newOrder()">申込・注文</button>
    <button onclick="newSchedule()">予定</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
